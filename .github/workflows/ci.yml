name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.14
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit -p tsconfig.json
      - run: bun run build
      - name: dist/ matches server.ts
        run: git diff --exit-code dist/
      - name: bundle loads on Node
        run: |
          out=$(node dist/server.js 2>&1 || true)
          echo "$out" | grep -q 'missing required env var'
